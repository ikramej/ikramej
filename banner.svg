<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="100%" height="230">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="230" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Math & Code Symbols in Background -->
  <g fill="#38bdf8" opacity="0.08" font-family="'Fira Code', monospace" font-size="28" font-weight="bold">
    <text x="50" y="60">∫</text>
    <text x="140" y="110">∑</text>
    <text x="80" y="170">λ</text>
    <text x="890" y="70">&lt;/&gt;</text>
    <text x="820" y="130">{...}</text>
    <text x="920" y="180">π</text>
    <text x="490" y="45">f(x)</text>
    <text x="280" y="55">∞</text>
    <text x="730" y="60">∀x∈ℝ</text>
  </g>

  <!-- Ambient Glow Spheres -->
  <circle cx="200" cy="70" r="80" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="800" cy="140" r="100" fill="#818cf8" opacity="0.12" filter="url(#glow)" />

  <!-- Wave Bottom Layers -->
  <path d="M0,170 C250,130 350,210 600,165 C780,135 880,185 1000,160 L1000,230 L0,230 Z" fill="url(#waveGrad)" />
  <path d="M0,195 C200,165 400,225 650,185 C800,160 900,210 1000,190 L1000,230 L0,230 Z" fill="url(#waveGrad2)" />

  <!-- Border Highlight -->
  <rect width="998" height="228" x="1" y="1" rx="15" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Foreground Content -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Main Title -->
    <text x="500" y="88" fill="url(#textGrad)" font-size="40" font-weight="800" letter-spacing="-0.5">
      Hi there, I'm Ikram 👋
    </text>

    <!-- Subtitle -->
    <text x="500" y="128" fill="url(#subGrad)" font-size="19" font-weight="600" letter-spacing="0.5">
      Double Degree in Mathematics &amp; Software Engineering
    </text>
  </g>
</svg>
